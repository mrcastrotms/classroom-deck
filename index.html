<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math - Classroom Deck</title>
    
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <!-- 1. LANDING VIEW -->
    <div id="landing-view" class="app-view active">
      <div class="landing-card">
        <h1>Welcome</h1>
        <p>Select your workspace</p>
        <div class="landing-actions">
          <button id="btn-nav-5th" class="fs-btn primary-btn">5th Grade</button>
          <button id="btn-nav-whiteboard" class="fs-btn">Whiteboard</button>
        </div>
      </div>
    </div>

<!-- 2. 5TH GRADE LOCKED VIEW -->
    <div id="fifth-grade-view" class="app-view hidden">
      <header class="locked-header">
        <div class="brand">
          <strong>THE MAYAN SCHOOL</strong>
          <span>5TH GRADE MATH</span>
        </div>

        <!-- NEW: Assignment Toolbar -->
        <div class="controls">
            <div class="segmented-control" style="background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.2);">
                <button id="btn-load-122" class="toggle-btn active" style="color: white;" type="button">1.2.2</button>
                <button id="btn-load-123" class="toggle-btn" style="color: white;" type="button">1.2.3</button>
            </div>
        </div>

        <div id="timer-display" class="timer">25:00</div>
        <!-- Hidden button for admin unlock (top right corner) -->
        <button id="btn-admin-unlock" class="admin-hidden-btn"></button>
      </header>
      
      <!-- Content Container for the Notebooks -->
      <main id="fifth-grade-content" class="locked-content" style="padding: 0; display: block; overflow: hidden;">
        <!-- JS will inject the assignment HTML here -->
      </main>
    </div>

    <!-- 3. EXISTING WHITEBOARD VIEW -->
    <div id="whiteboard-view" class="app-view hidden">
      <header>
        <div class="brand">
          <strong>THE MAYAN SCHOOL</strong>
          <span>MR. CASTRO</span>
        </div>

        <div class="controls">
          <!-- Viewport Controls -->
          <div class="segmented-control">
            <button id="toggle-mac" class="toggle-btn" type="button">Mac View</button>
            <button id="toggle-smartboard" class="toggle-btn active" type="button">LG Smartboard</button>
          </div>

          <!-- Drawing Tools -->
          <div class="segmented-control">
            <button id="tool-draw" class="toggle-btn active" type="button">Draw</button>
            <button id="tool-erase" class="toggle-btn" type="button">Erase</button>
            <input type="color" id="pen-color" value="#38bdf8" title="Pick Color" class="color-picker" />
          </div>

          <!-- Touch Mode Toggle -->
          <button id="toggle-multitouch" class="fs-btn" type="button">Multi Touch: OFF</button>

          <!-- Grid Controls -->
          <div class="segmented-control">
            <button id="btn-toggle-grid" class="toggle-btn" type="button">Grid: OFF</button>
            <select id="select-grid-size" class="grid-select" title="Grid Size">
              <option value="20">20px</option>
              <option value="40" selected>40px</option>
              <option value="60">60px</option>
              <option value="80">80px</option>
            </select>
          </div>

          <button id="btn-clear" class="fs-btn" type="button">Clear</button>
          <button id="btn-toggle-content" class="fs-btn" type="button">Toggle Text</button>
          <button id="btn-fullscreen" class="fs-btn" type="button">Fullscreen</button>
          <button id="btn-exit-whiteboard" class="fs-btn exit-btn" type="button">Exit</button>
        </div>
      </header>

      <main>
        <div id="stage" class="smartboard">
          <!-- Content Layer -->
          <div class="content-frame" id="content-frame">
            <div id="grid-overlay" class="grid-overlay hidden"></div>

            <div id="placeholder-text">
              <h2 id="view-title">LG Smartboard</h2>
              <div class="viewport-badge" id="view-dimensions">1280 × 720</div>
              <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 12px;">
                Select Draw or Erase to begin.
              </p>
            </div>

            <!-- Canvas element -->
            <canvas id="draw-canvas"></canvas>
          </div>

          <footer>
            <span id="telemetry-preset">Preset: LG Smartboard</span>
            <span id="telemetry-fs">Fullscreen: OFF</span>
          </footer>
        </div>
      </main>
    </div>

    <!-- 4. ADMIN LOCKDOWN MODAL -->
    <div id="admin-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <h2>Device Locked</h2>
        <p>Enter Admin PIN to exit 5th Grade mode.</p>
        <div class="pin-container">
          <input type="password" id="admin-pin-input" placeholder="••••" maxlength="4" />
        </div>
        <p id="pin-error" class="error-text hidden">Incorrect PIN.</p>
        <div class="modal-actions">
          <button id="btn-submit-pin" class="primary-btn">Unlock</button>
          <button id="btn-return-fullscreen" class="fs-btn">Return to Assignment</button>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
