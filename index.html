<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Mayan School - Presentation Deck</title>
    
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>THE MAYAN SCHOOL</strong>
        <span>MR. CASTRO</span>
      </div>

      <div class="controls">
        <div class="segmented-control">
          <button id="toggle-mac" class="toggle-btn">Mac View</button>
          <button id="toggle-smartboard" class="toggle-btn active">
            LG Smartboard
          </button>
        </div>
        <button id="btn-fullscreen" class="fs-btn">⛶ Fullscreen</button>
      </div>
    </header>

    <main>
      <div id="stage">
        <div class="content-frame">
          <h2 id="view-title">LG Smartboard</h2>
          <div class="viewport-badge" id="view-dimensions">1280 × 720</div>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 12px;">
            Build or populate content here. Toggle views to test scaling.
          </p>
        </div>

        <footer>
          <span id="telemetry-preset">Preset: LG Smartboard</span>
          <span id="telemetry-fs">Fullscreen: OFF</span>
        </footer>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
